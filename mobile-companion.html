<!DOCTYPE html>
<html lang="tr">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Jumper Chat - Mobile Companion</title>
	<style>
		/* ============================================
		   Jumper Chat Mobile Companion Styles
		   ============================================ */

		:root {
			--container-padding: 12px;
			--jumper-primary: #007acc;
			--jumper-secondary: #2b3a50;
			--jumper-accent: #0c7b93;
			--surface-0: #1e1e1e;
			--surface-1: color-mix(in srgb, var(--surface-0) 88%, #ffffff 12%);
			--surface-2: color-mix(in srgb, var(--surface-0) 94%, #000000 6%);
			--surface-card: color-mix(in srgb, var(--surface-0) 92%, #ffffff 8%);
			--surface-card-strong: color-mix(in srgb, var(--surface-0) 78%, #ffffff 22%);
			--surface-border: rgba(255, 255, 255, 0.12);
			--text-primary: #e0e0e0;
			--text-muted: #9a9a9a;
			--success-color: #10b981;
			--warning-color: #3794ff;
			--error-color: #ef4444;
			--user-bubble-max-width: min(78%, 520px);
			--vscode-editor-background: var(--surface-0);
			--vscode-editor-foreground: var(--text-primary);
			--vscode-foreground: var(--text-primary);
			--vscode-sideBar-background: var(--surface-1);
			--vscode-sideBar-foreground: var(--text-primary);
			--vscode-panel-border: var(--surface-border);
			--vscode-descriptionForeground: var(--text-muted);
			--vscode-input-background: var(--surface-2);
			--vscode-input-foreground: var(--text-primary);
			--vscode-input-border: var(--surface-border);
			--vscode-editor-font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
		}

		html {
			height: 100%;
			overflow: hidden;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
			background: var(--surface-0);
			color: var(--text-primary);
			height: 100vh;
			height: 100dvh;
			display: flex;
			flex-direction: column;
			font-size: 14px;
			line-height: 1.5;
			overflow: hidden;
		}

		/* Header */
		.header {
			background: var(--surface-1);
			padding: 12px 16px;
			border-bottom: 1px solid var(--surface-border);
			display: flex;
			align-items: center;
			justify-content: space-between;
			position: sticky;
			top: 0;
			z-index: 100;
			flex-shrink: 0;
		}

		.header-brand {
			display: flex;
			align-items: center;
			gap: 8px;
		}

		.header-brand svg {
			width: 24px;
			height: 24px;
		}

		.header-title {
			font-weight: 600;
			font-size: 16px;
		}

		.header-status {
			display: flex;
			align-items: center;
			gap: 6px;
			font-size: 12px;
			color: var(--text-muted);
		}

		.status-dot {
			width: 8px;
			height: 8px;
			border-radius: 50%;
			background: var(--success-color);
		}

		.status-dot.disconnected {
			background: var(--error-color);
		}

		/* Chat Container */
		.chat-container {
			flex: 1 1 auto;
			min-height: 0;
			overflow-y: auto;
			padding: 16px;
			display: flex;
			flex-direction: column;
			gap: 8px;
		}

		/* Message Bubbles */
		.message {
			margin: 0 0 14px;
			max-width: 100%;
			color: inherit;
			word-break: break-word;
			animation: fadeIn 0.2s ease-out;
		}

		@keyframes fadeIn {
			from {
				opacity: 0;
				transform: translateY(8px);
			}

			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.message.user,
		.user-message {
			align-self: flex-end;
			margin-left: auto;
			background: var(--surface-1);
			border: 1px solid var(--surface-border);
			border-radius: 12px;
			padding: 10px 14px;
			max-width: var(--user-bubble-max-width);
			line-height: 1.55;
		}

		.message.assistant,
		.bot-message {
			align-self: flex-start;
			display: block;
			margin-left: 0;
			margin-right: auto;
			padding: 0;
			background: none !important;
			border: 0 !important;
			border-radius: 0 !important;
			box-shadow: none !important;
			max-width: 100%;
			line-height: 1.55;
		}

		.message-bubble {
			padding: 0;
			border-radius: 0;
			min-width: 0;
		}

		.message.user .message-bubble {
			background: transparent;
		}

		.message.assistant .message-bubble {
			background: transparent;
			padding: 0;
		}

		.message-body {
			min-width: 0;
		}

		.bot-message p,
		.bot-message ul,
		.bot-message ol,
		.bot-message pre,
		.bot-message blockquote {
			margin: 0;
			padding: 0;
		}

		.bot-message ul,
		.bot-message ol {
			padding-left: 0;
			margin: 0;
		}

		.bot-message li {
			margin: 0;
			padding: 0;
		}

		.bot-message strong {
			color: color-mix(in srgb, var(--jumper-primary) 60%, var(--vscode-foreground) 40%);
			font-weight: 600;
		}

		.bot-message em {
			color: color-mix(in srgb, var(--jumper-primary) 45%, var(--vscode-foreground) 55%);
		}

		pre {
			position: relative;
			background: var(--surface-2);
			border: 1px solid var(--surface-border);
			padding: 12px 14px;
			border-radius: 12px;
			overflow-x: auto;
			margin: 14px 0;
			font-size: 0.9rem;
			line-height: 1.55;
		}

		pre code {
			display: block;
			background: transparent;
			border: none;
			padding: 0;
			margin: 0;
			font-family: var(--vscode-editor-font-family);
			white-space: pre;
		}

		code {
			font-family: var(--vscode-editor-font-family);
			background: color-mix(in srgb, var(--surface-0) 70%, #000000 30%);
			border: 1px solid var(--surface-border);
			padding: 2px 6px;
			border-radius: 6px;
			color: var(--vscode-editor-foreground);
			white-space: pre-wrap;
		}

		/* NexMaker Narrative Styles */
		.nexmaker-narrative {
			line-height: 1.6;
		}

		.nexmaker-narrative.has-text {
			display: flex;
			flex-direction: column;
			gap: 18px;
			margin: 12px 0;
		}

		.narrative-paragraph {
			margin: 0 0 12px;
			font-size: 0.92rem;
			line-height: 1.58;
			opacity: 0.92;
		}

		.narrative-paragraph:last-child {
			margin-bottom: 0;
		}

		.nexmaker-section {
			display: flex;
			flex-direction: column;
			gap: 10px;
			padding: 0;
			border: none;
			background: transparent;
			border-radius: 10px;
		}

		.nexmaker-narrative.has-text .nexmaker-section {
			padding-left: 14px;
			border-left: 2px solid color-mix(in srgb, var(--jumper-primary) 32%, transparent 68%);
		}

		.nexmaker-narrative.has-text .nexmaker-section + .nexmaker-section {
			margin-top: 6px;
		}

		.nexmaker-section-title {
			font-weight: 600;
			font-size: 1rem;
			letter-spacing: 0.01em;
			opacity: 0.95;
			color: color-mix(in srgb, var(--jumper-primary) 75%, var(--vscode-foreground) 25%);
		}

		.nexmaker-section p {
			margin: 0 0 10px;
			font-size: 0.9rem;
			opacity: 0.95;
			line-height: 1.55;
		}

		.nexmaker-section p:last-child {
			margin-bottom: 0;
		}

		.nexmaker-flow-heading {
			margin: 0;
			line-height: 1.25;
		}

		.nexmaker-narrative.has-text .nexmaker-list {
			list-style: none;
			margin: 0;
			padding: 0;
			display: flex;
			flex-direction: column;
			gap: 6px;
			font-size: 0.88rem;
			opacity: 0.95;
		}

		.nexmaker-narrative.has-text .nexmaker-list li {
			position: relative;
			padding-left: 18px;
			margin: 0;
			line-height: 1.5;
		}

		.nexmaker-narrative.has-text .nexmaker-list li::before {
			content: '\2022';
			position: absolute;
			left: 0;
			top: 0.4em;
			transform: translateY(-50%);
			color: color-mix(in srgb, var(--jumper-primary) 70%, #ffffff 30%);
			font-weight: 700;
			font-size: 0.95rem;
		}

		.nexmaker-narrative.has-text .nexmaker-list.ordered {
			counter-reset: narrative-ordered;
		}

		.nexmaker-narrative.has-text .nexmaker-list.ordered li {
			counter-increment: narrative-ordered;
		}

		.nexmaker-narrative.has-text .nexmaker-list.ordered li::before {
			content: counter(narrative-ordered) ".";
			font-size: 0.9rem;
			font-weight: 600;
			color: color-mix(in srgb, var(--jumper-primary) 85%, #ffffff 15%);
		}

		.nexmaker-narrative.has-text .nexmaker-flow-quote {
			margin: 0;
			padding: 12px 16px;
			border-left: 3px solid color-mix(in srgb, var(--jumper-primary) 45%, transparent 55%);
			background: color-mix(in srgb, var(--surface-1) 78%, var(--jumper-primary) 22%);
			border-radius: 12px;
		}

		.nexmaker-narrative.has-text .nexmaker-flow-quote p {
			margin: 0;
			font-size: 0.9rem;
			line-height: 1.6;
			opacity: 0.96;
		}

		.nexmaker-narrative.has-text .nexmaker-callout {
			display: flex;
			flex-direction: column;
			gap: 8px;
			padding: 14px 16px;
			border-radius: 14px;
			border: 1px solid color-mix(in srgb, var(--surface-border) 68%, transparent 32%);
			background: color-mix(in srgb, var(--surface-1) 82%, var(--surface-0) 18%);
			box-shadow: inset 0 1px 0 color-mix(in srgb, #ffffff 8%, transparent 92%);
		}

		.nexmaker-narrative.has-text .nexmaker-callout.tone-info {
			border-color: color-mix(in srgb, var(--jumper-primary) 46%, var(--surface-border) 54%);
			background: color-mix(in srgb, var(--jumper-primary) 14%, var(--surface-1) 86%);
		}

		.nexmaker-narrative.has-text .nexmaker-callout.tone-success {
			border-color: color-mix(in srgb, #34d399 42%, var(--surface-border) 58%);
			background: color-mix(in srgb, #34d399 13%, var(--surface-1) 87%);
		}

		.nexmaker-narrative.has-text .nexmaker-callout.tone-warning {
			border-color: color-mix(in srgb, #f59e0b 48%, var(--surface-border) 52%);
			background: color-mix(in srgb, #f59e0b 15%, var(--surface-1) 85%);
		}

		.nexmaker-narrative.has-text .nexmaker-callout.tone-neutral {
			border-color: color-mix(in srgb, var(--surface-border) 82%, transparent 18%);
			background: color-mix(in srgb, var(--surface-0) 55%, var(--surface-1) 45%);
		}

		.nexmaker-narrative.has-text .nexmaker-callout-title {
			font-size: 0.8rem;
			font-weight: 700;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			opacity: 0.84;
		}

		.nexmaker-narrative.has-text .nexmaker-callout-body {
			margin: 0;
			font-size: 0.9rem;
			line-height: 1.58;
			opacity: 0.95;
		}

		.nexmaker-inline-link {
			color: color-mix(in srgb, var(--jumper-primary) 65%, #ffffff 35%);
			text-decoration: none;
			font-weight: 500;
		}

		.nexmaker-inline-link:hover {
			text-decoration: underline;
		}

		.bot-message button:not(.copy-btn),
		.nexmaker-narrative button {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			max-width: 100%;
			background: var(--jumper-primary);
			color: #fff;
			border: 1px solid color-mix(in srgb, var(--jumper-primary) 65%, var(--surface-border) 35%);
			border-radius: 8px;
			padding: 6px 10px;
			font: inherit;
			font-weight: 600;
			text-decoration: none;
		}

		.nexmaker-narrative p {
			margin-bottom: 10px;
		}

		.nexmaker-narrative p:last-child {
			margin-bottom: 0;
		}

		.nexmaker-narrative code {
			font-size: 0.9em;
		}

		.nexmaker-narrative strong {
			color: color-mix(in srgb, var(--jumper-primary) 60%, var(--vscode-foreground) 40%);
		}

		/* NexMaker Cart Card */
		.nexmaker-cart-card {
			margin: 18px 0;
			border: 1px solid var(--surface-border);
			border-radius: 18px;
			background: var(--surface-card);
			box-shadow: 0 18px 36px rgba(0, 0, 0, 0.25);
			color: var(--vscode-foreground);
			overflow: hidden;
		}

		.nexmaker-card {
			display: flex;
			flex-direction: column;
			gap: 16px;
			background: var(--surface-card);
			border: 1px solid var(--surface-border);
			border-radius: 16px;
			padding: 18px 20px;
			margin-top: 16px;
			color: var(--vscode-foreground);
			box-shadow: 0 16px 36px rgba(0, 0, 0, 0.18);
		}

		.nexmaker-card-body {
			display: flex;
			gap: 16px;
		}

		.nexmaker-card-media {
			width: 82px;
			height: 82px;
			border-radius: 12px;
			overflow: hidden;
			flex-shrink: 0;
			background: rgba(12, 123, 147, 0.18);
		}

		.nexmaker-card-media img {
			width: 100%;
			height: 100%;
			object-fit: cover;
			display: block;
		}

		.nexmaker-card-content {
			display: flex;
			flex: 1;
			flex-direction: column;
			gap: 8px;
		}

		.nexmaker-card-title {
			font-weight: 600;
			font-size: 0.95rem;
		}

		.nexmaker-card-subtitle {
			font-size: 0.8rem;
			opacity: 0.85;
		}

		.nexmaker-card-actions,
		.cart-actions {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
			margin-top: 4px;
		}

		.nexmaker-cart-button {
			align-self: flex-start;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			background: var(--jumper-primary);
			color: #fff;
			border: 1px solid color-mix(in srgb, var(--jumper-primary) 65%, var(--surface-border) 35%);
			border-radius: 12px;
			padding: 10px 18px;
			cursor: pointer;
			font-weight: 600;
			font-size: 0.9rem;
			text-decoration: none;
			transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.2s ease, border-color 0.2s ease;
		}

		.nexmaker-cart-button:hover {
			background: color-mix(in srgb, var(--jumper-primary) 82%, #ffffff 18%);
			border-color: color-mix(in srgb, var(--jumper-primary) 80%, var(--surface-border) 20%);
			transform: translateY(-1px);
			box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
		}

		.nexmaker-card-note {
			font-size: 0.8rem;
			opacity: 0.9;
			margin: 0;
		}

		.nexmaker-card-total {
			font-size: 0.85rem;
			font-weight: 500;
		}

		.nexmaker-card-price {
			font-size: 0.9rem;
			text-align: right;
		}

		.nexmaker-cart-card summary {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			padding: 16px 20px;
			cursor: pointer;
			user-select: none;
			background: color-mix(in srgb, var(--surface-card) 86%, #000000 14%);
			list-style: none;
		}

		.nexmaker-cart-card summary::-webkit-details-marker {
			display: none;
		}

		.cart-summary-left {
			display: flex;
			flex-direction: column;
			gap: 2px;
		}

		.cart-summary-title {
			font-weight: 600;
			font-size: 14px;
		}

		.cart-summary-subtitle {
			font-size: 12px;
			color: var(--text-muted);
		}

		.cart-summary-right {
			display: flex;
			align-items: center;
			gap: 10px;
			flex-wrap: wrap;
			font-size: 13px;
		}

		.cart-summary-total {
			font-weight: 600;
		}

		.nexmaker-chip {
			padding: 3px 10px;
			border-radius: 12px;
			font-size: 11px;
			font-weight: 500;
		}

		.nexmaker-chip.info {
			background: var(--jumper-primary);
			color: white;
		}

		.nexmaker-chip.warning {
			background: var(--warning-color);
			color: #fff;
		}

		.nexmaker-chip.accent {
			background: rgba(139, 92, 246, 0.24);
			color: rgba(196, 181, 253, 0.95);
		}

		.cart-summary-chevron {
			width: 10px;
			height: 10px;
			border-right: 2px solid currentColor;
			border-bottom: 2px solid currentColor;
			transform: rotate(45deg);
			transition: transform 0.2s;
			opacity: 0.6;
		}

		.nexmaker-cart-card[open] .cart-summary-chevron {
			transform: rotate(-135deg);
		}

		.cart-body {
			display: flex;
			flex-direction: column;
			gap: 18px;
			padding: 20px;
			background: color-mix(in srgb, var(--surface-card) 94%, #000000 6%);
			border-top: 1px solid color-mix(in srgb, var(--surface-border) 65%, transparent 35%);
		}

		/* Product Grid */
		.nexmaker-products-grid {
			display: grid;
			grid-template-columns: repeat(2, 1fr);
			gap: 14px;
			margin: 16px 0;
		}

		.nexmaker-cart-product {
			position: relative;
			display: flex;
			flex-direction: column;
			gap: 12px;
			min-height: 230px;
			background: var(--surface-card);
			border: 1px solid var(--surface-border);
			border-radius: 14px;
			overflow: hidden;
			box-shadow: 0 12px 26px rgba(0, 0, 0, 0.22);
		}

		.cart-product-media {
			aspect-ratio: 4/3;
			overflow: hidden;
			background: var(--surface-1);
		}

		.cart-product-media img {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		.cart-product-body {
			display: flex;
			flex-direction: column;
			gap: 10px;
			flex: 1;
			padding: 10px;
		}

		.cart-product-name {
			margin: 0;
			font-size: 12px;
			font-weight: 600;
			line-height: 1.35;
			color: var(--vscode-foreground);
			display: -webkit-box;
			line-clamp: 2;
			-webkit-line-clamp: 2;
			-webkit-box-orient: vertical;
			overflow: hidden;
			word-break: break-word;
		}

		.cart-product-pricing {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: 6px;
			font-size: 12px;
		}

		.nexmaker-price-old {
			text-decoration: line-through;
			color: var(--text-muted);
		}

		.nexmaker-price-new {
			color: var(--success-color);
			font-weight: 600;
		}

		.nexmaker-price-tag {
			display: inline-flex;
			align-items: center;
			background: rgba(34, 197, 94, 0.18);
			color: rgba(34, 197, 94, 0.95);
			padding: 2px 6px;
			border-radius: 6px;
			font-size: 10px;
			font-weight: 600;
		}

		.nexmaker-qty {
			color: var(--text-muted);
		}

		/* Step Indicators */
		.step-indicator {
			display: flex;
			align-items: center;
			gap: 8px;
			padding: 8px 12px;
			background: var(--surface-1);
			border-radius: 8px;
			margin: 8px 0;
		}

		.step-indicator.success {
			border-left: 3px solid var(--success-color);
		}

		.step-indicator.pending {
			border-left: 3px solid var(--warning-color);
		}

		/* User Attachment Preview */
		.message-attachment {
			margin-top: 8px;
			border-radius: 12px;
			overflow: hidden;
			max-width: 200px;
		}

		.message-attachment img,
		.message-attachment video {
			width: 100%;
			display: block;
		}

		/* Input Area */
		.input-area {
			background: var(--surface-0);
			border-top: 1px solid var(--surface-border);
			padding: 10px var(--container-padding) max(12px, env(safe-area-inset-bottom));
			position: sticky;
			bottom: 0;
			z-index: 100;
			flex-shrink: 0;
		}

		.attachment-preview-bar {
			display: flex;
			gap: 8px;
			margin-bottom: 10px;
			overflow-x: auto;
			padding-bottom: 4px;
		}

		.attachment-preview-bar:empty {
			display: none;
		}

		.attachment-preview {
			position: relative;
			width: 60px;
			height: 60px;
			border-radius: 8px;
			overflow: hidden;
			flex-shrink: 0;
		}

		.attachment-preview img,
		.attachment-preview video {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		.attachment-remove {
			position: absolute;
			top: 4px;
			right: 4px;
			width: 20px;
			height: 20px;
			background: rgba(0, 0, 0, 0.7);
			border: none;
			border-radius: 50%;
			color: white;
			font-size: 14px;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.input-row {
			display: flex;
			align-items: center;
			gap: 10px;
		}

		.input-actions {
			display: flex;
			gap: 6px;
		}

		.action-btn {
			width: 40px;
			height: 40px;
			border: 1px solid color-mix(in srgb, var(--surface-border) 70%, transparent);
			border-radius: 50%;
			background: rgba(255, 255, 255, 0.05);
			color: var(--text-primary);
			font-size: 18px;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: background 0.2s;
		}

		.action-btn:hover {
			background: var(--surface-card);
		}

		.message-input-wrapper {
			flex: 1;
			background: var(--surface-card);
			border: 1px solid color-mix(in srgb, var(--surface-border) 70%, transparent);
			border-radius: 16px;
			padding: 8px 14px;
			display: flex;
			align-items: flex-end;
			gap: 8px;
			min-width: 0;
			box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
		}

		.message-input {
			flex: 1;
			background: transparent;
			border: none;
			color: var(--text-primary);
			font-size: 14px;
			resize: none;
			max-height: 120px;
			min-height: 24px;
			line-height: 1.5;
			width: 100%;
		}

		.message-input:focus {
			outline: none;
		}

		.message-input::placeholder {
			color: var(--text-muted);
		}

		.send-btn {
			width: 40px;
			height: 40px;
			border: none;
			border-radius: 50%;
			background: var(--jumper-primary);
			color: white;
			font-size: 18px;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: transform 0.15s, background 0.2s;
			flex-shrink: 0;
		}

		.send-btn:hover {
			background: color-mix(in srgb, var(--jumper-primary) 82%, #ffffff 18%);
		}

		.send-btn:active {
			transform: scale(0.95);
		}

		.send-btn:disabled {
			background: var(--surface-2);
			cursor: not-allowed;
		}

		/* Mode Toggle */
	.mode-toggle {
		display: flex;
		align-items: center;
		justify-content: space-between;
		flex-wrap: wrap;
		gap: 6px 10px;
		margin-bottom: 10px;
		font-size: 12px;
		color: var(--text-muted);
	}

		.mode-toggle-left {
			display: flex;
			align-items: center;
			gap: 8px;
			flex: 1 1 auto;
			min-width: 0;
		}

		.mode-toggle-actions {
			display: flex;
			align-items: center;
			gap: 6px;
			flex-shrink: 0;
		}

		.mode-toggle-switch {
			display: flex;
			background: var(--surface-2);
			border: 1px solid color-mix(in srgb, var(--surface-border) 70%, transparent);
			border-radius: 20px;
			padding: 2px;
		}

	.mode-option {
		height: 28px;
		padding: 0 10px;
		border-radius: 18px;
		border: none;
		background: transparent;
		color: var(--text-muted);
		font-size: 11px;
		cursor: pointer;
		display: flex;
		align-items: center;
		transition: all 0.2s;
	}

	.mode-option.active {
		background: color-mix(in srgb, var(--jumper-primary) 75%, #ffffff 25%);
		color: white;
	}

	.mode-toggle-actions .action-btn {
		width: 28px;
		height: 28px;
		font-size: 14px;
	}

		/* Loading States */
		.loading-dots {
			display: flex;
			gap: 4px;
			padding: 10px;
		}

		.loading-dots span {
			width: 8px;
			height: 8px;
			background: var(--text-muted);
			border-radius: 50%;
			animation: bounce 1.4s infinite ease-in-out both;
		}

		.loading-dots span:nth-child(1) {
			animation-delay: -0.32s;
		}

		.loading-dots span:nth-child(2) {
			animation-delay: -0.16s;
		}

		@keyframes bounce {

			0%,
			80%,
			100% {
				transform: scale(0);
			}

			40% {
				transform: scale(1);
			}
		}

		/* Connection Status */
		.connection-status {
			text-align: center;
			padding: 40px 20px;
			color: var(--text-muted);
		}

		.connection-status h2 {
			margin-bottom: 10px;
		}

		/* Empty State */
		.empty-state {
			text-align: center;
			padding: 40px 20px;
			color: var(--text-muted);
		}

		.empty-state-icon {
			font-size: 48px;
			margin-bottom: 16px;
		}

		/* File Input (hidden) */
		.hidden-input {
			display: none;
		}

		/* Scrollbar */
		::-webkit-scrollbar {
			width: 4px;
		}

		::-webkit-scrollbar-track {
			background: transparent;
		}

		::-webkit-scrollbar-thumb {
			background: var(--surface-border);
			border-radius: 2px;
		}
	</style>
</head>

<body>
	<!-- Header -->
	<header class="header">
		<div class="header-brand">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
				<circle cx="12" cy="12" r="10" />
				<path d="M12 6v6l4 2" />
			</svg>
			<span class="header-title">Jumper Chat</span>
		</div>
		<div class="header-status">
			<span class="status-dot" id="status-dot"></span>
			<span id="status-text">Bağlanıyor...</span>
		</div>
	</header>

	<!-- Chat Container -->
	<div class="chat-container" id="chat-container">
		<div class="connection-status" id="connection-status">
			<h2>Bağlantı Bekleniyor</h2>
			<p>Jumper Hub ile bağlantı kuruluyor...</p>
		</div>
	</div>

	<!-- Input Area -->
	<div class="input-area">
		<!-- Mode Toggle -->
		<div class="mode-toggle">
			<div class="mode-toggle-left">
			<span>Medya modu:</span>
			<div class="mode-toggle-switch">
				<button class="mode-option active" data-mode="add">📎 Ekle</button>
				<button class="mode-option" data-mode="send">🚀 Gönder</button>
			</div>
			</div>
			<div class="mode-toggle-actions">
				<button class="action-btn" id="gallery-btn" title="Galeri">🖼️</button>
				<button class="action-btn" id="camera-btn" title="Kamera">📷</button>
				<button class="action-btn" id="video-btn" title="Video">🎥</button>
			</div>
		</div>

		<!-- Attachment Preview Bar -->
		<div class="attachment-preview-bar" id="attachment-preview-bar"></div>

		<!-- Input Row -->
		<div class="input-row">
			<div class="message-input-wrapper">
				<textarea class="message-input" id="message-input" placeholder="Mesajınızı yazın..."
					rows="1"></textarea>
			</div>
			<button class="send-btn" id="send-btn" disabled>
				<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
					<path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
				</svg>
			</button>
		</div>
	</div>

	<!-- Hidden File Inputs -->
	<input type="file" class="hidden-input" id="camera-input" accept="image/*" capture="environment">
	<input type="file" class="hidden-input" id="gallery-input" accept="image/*" multiple>
	<input type="file" class="hidden-input" id="video-input" accept="video/*" capture="environment">

	<script>
		// ============================================
		// Mobile Companion JavaScript
		// ============================================

		// URL Parameters
		const urlParams = new URLSearchParams(window.location.search);
		const SESSION_ID = urlParams.get('s');
		const SESSION_TOKEN = urlParams.get('t');
		const ENCRYPTED_KEY = urlParams.get('k');

		// GitHub Config
		const GITHUB_OWNER = 'mmuratyilmaz';
		const GITHUB_REPO = 'jumper-media';
		const GITHUB_BRANCH = 'main';

		// XOR Decryption Key
		const EK = 'snap-send-2024-secure-key';

		// State
		let githubToken = null;
		let isConnected = false;
		let sendMode = 'add';  // 'add' or 'send'
		let pendingAttachments = [];
		let lastSyncSequence = 0;
		let messageSequence = 0;
		let heartbeatInterval = null;

		// DOM Elements
		const chatContainer = document.getElementById('chat-container');
		const connectionStatus = document.getElementById('connection-status');
		const statusDot = document.getElementById('status-dot');
		const statusText = document.getElementById('status-text');
		const messageInput = document.getElementById('message-input');
		const sendBtn = document.getElementById('send-btn');
		const attachmentPreviewBar = document.getElementById('attachment-preview-bar');
		const cameraInput = document.getElementById('camera-input');
		const galleryInput = document.getElementById('gallery-input');
		const videoInput = document.getElementById('video-input');

		// ============================================
		// XOR Decryption
		// ============================================
		function xorDecrypt(enc) {
			try {
				let b64 = enc.replace(/-/g, '+').replace(/_/g, '/');
				while (b64.length % 4) b64 += '=';
				const bytes = atob(b64);
				let result = '';
				for (let i = 0; i < bytes.length; i++) {
					result += String.fromCharCode(bytes.charCodeAt(i) ^ EK.charCodeAt(i % EK.length));
				}
				return result;
			} catch (e) {
				return null;
			}
		}

		// ============================================
		// GitHub API Functions
		// ============================================
		async function fetchFromGitHub(path, options = {}) {
			const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}`;
			const headers = {
				'Authorization': `token ${githubToken}`,
				'Accept': 'application/vnd.github.v3+json',
				...options.headers
			};
			return fetch(url, { ...options, headers });
		}

		async function uploadToGitHub(path, content, message) {
			const encodedContent = btoa(unescape(encodeURIComponent(
				typeof content === 'string' ? content : JSON.stringify(content)
			)));

			const response = await fetchFromGitHub(path, {
				method: 'PUT',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({
					message,
					content: encodedContent,
					branch: GITHUB_BRANCH
				})
			});

			// 401 Unauthorized - Token expire olmuş
			if (response.status === 401) {
				showError('Oturum süresi dolmuş. Lütfen sayfayı yenileyip QR kodu tekrar okutun.');
				return false;
			}

			return response.ok;
		}

		// ============================================
		// Session Management
		// ============================================
		async function initSession() {
			if (!SESSION_ID || !SESSION_TOKEN || !ENCRYPTED_KEY) {
				showError('Geçersiz bağlantı parametreleri');
				return;
			}

			// Decrypt GitHub token
			githubToken = xorDecrypt(ENCRYPTED_KEY);
			if (!githubToken) {
				showError('Token çözülemiyor');
				return;
			}

			// Verify session
			try {
				const response = await fetchFromGitHub(`sessions/${SESSION_ID}/.session`);
				if (!response.ok) {
					throw new Error('Session bulunamadı');
				}

				const sessionData = await response.json();
				const sessionContent = JSON.parse(atob(sessionData.content));

				if (sessionContent.token !== SESSION_TOKEN) {
					throw new Error('Geçersiz token');
				}

				if (sessionContent.expiresAt && Date.now() > sessionContent.expiresAt) {
					throw new Error('Session süresi dolmuş');
				}

				// Connected!
				setConnected(true);

				// Load conversation
				await loadConversation();

				// Start heartbeat (async - SHA'yı önceden alır)
				await startHeartbeat();

				// Start polling for new responses
				startPolling();

			} catch (error) {
				showError(error.message);
			}
		}

		async function loadConversation() {
			try {
				const response = await fetchFromGitHub(`sessions/${SESSION_ID}/conversation.json`);
				if (!response.ok) {
					// No conversation yet
					connectionStatus.style.display = 'none';
					return;
				}

				const data = await response.json();

				// UTF-8 için doğru decode
				const base64Content = data.content.replace(/\n/g, '');
				const binaryString = atob(base64Content);
				const bytes = new Uint8Array(binaryString.length);
				for (let i = 0; i < binaryString.length; i++) {
					bytes[i] = binaryString.charCodeAt(i);
				}
				const decodedText = new TextDecoder('utf-8').decode(bytes);
				const conversation = JSON.parse(decodedText);

				connectionStatus.style.display = 'none';
				lastSyncSequence = conversation.lastSyncSequence || 0;
				messageSequence = lastSyncSequence;

				// Render messages
				conversation.messages.forEach(msg => {
					renderMessage(msg);
				});

				scrollToBottom();
			} catch (error) {
				console.error('Conversation load error:', error);
			}
		}

		async function startHeartbeat() {
			let heartbeatSha = null;  // Heartbeat dosyasının SHA değeri
			const heartbeatPath = `sessions/${SESSION_ID}/messages/heartbeat.json`;

			// Başlangıçta mevcut heartbeat.json'ın SHA'sını al (varsa)
			try {
				const initResp = await fetchFromGitHub(heartbeatPath);
				if (initResp.ok) {
					const data = await initResp.json();
					heartbeatSha = data.sha;
					console.log('Heartbeat SHA initialized:', heartbeatSha);
				}
			} catch (e) {
				// İlk defa oluşturulacak, sorun değil
			}

			heartbeatInterval = setInterval(async () => {
				try {
					const heartbeatContent = JSON.stringify({ timestamp: Date.now() });
					const encodedContent = btoa(unescape(encodeURIComponent(heartbeatContent)));

					// Eğer SHA varsa güncelleme, yoksa yeni oluşturma
					const body = {
						message: 'Heartbeat',
						content: encodedContent,
						branch: GITHUB_BRANCH
					};

					// Mevcut SHA varsa ekle
					if (heartbeatSha) {
						body.sha = heartbeatSha;
					}

					const response = await fetchFromGitHub(heartbeatPath, {
						method: 'PUT',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify(body)
					});

					if (response.ok) {
						// Yeni SHA değerini kaydet
						const result = await response.json();
						heartbeatSha = result.content?.sha;
					} else if (response.status === 422 || response.status === 409) {
						// SHA uyuşmazlığı veya Conflict - mevcut SHA'yı al ve tekrar dene
						console.log('Heartbeat SHA conflict, refreshing...');
						const getResp = await fetchFromGitHub(heartbeatPath);
						if (getResp.ok) {
							const data = await getResp.json();
							heartbeatSha = data.sha;
						}
					}
				} catch (e) {
					console.warn('Heartbeat failed:', e);
				}
			}, 30000);
		}

		function startPolling() {
			setInterval(async () => {
				await checkForNewResponses();
			}, 3000);
		}

		async function checkForNewResponses() {
			try {
				const response = await fetchFromGitHub(`sessions/${SESSION_ID}/responses`);
				if (!response.ok) return;

				const files = await response.json();
				for (const file of files) {
					if (!file.name.endsWith('.json')) continue;

					const seqMatch = file.name.match(/resp-(\d+)\.json/);
					if (!seqMatch) continue;

					const seq = parseInt(seqMatch[1], 10);
					if (seq <= lastSyncSequence) continue;

					// UTF-8 encoding sorununu düzeltmek için GitHub API'den base64 content'i al
					try {
						// Dosyanın detaylarını al (base64 encoded content içerir)
						const fileDetailResp = await fetchFromGitHub(`sessions/${SESSION_ID}/responses/${file.name}`);
						if (!fileDetailResp.ok) continue;

						const fileDetail = await fileDetailResp.json();

						// Base64'ten UTF-8'e düzgün decode et
						const base64Content = fileDetail.content.replace(/\n/g, '');
						const binaryString = atob(base64Content);
						const bytes = new Uint8Array(binaryString.length);
						for (let i = 0; i < binaryString.length; i++) {
							bytes[i] = binaryString.charCodeAt(i);
						}
						const decodedText = new TextDecoder('utf-8').decode(bytes);
						const message = JSON.parse(decodedText);

						renderMessage(message);
						lastSyncSequence = Math.max(lastSyncSequence, seq);
						scrollToBottom();
					} catch (decodeError) {
						console.warn('Message decode error:', decodeError);
						// Fallback: eski yöntemle dene
						try {
							const respData = await fetch(file.download_url);
							if (respData.ok) {
								const message = await respData.json();
								renderMessage(message);
								lastSyncSequence = Math.max(lastSyncSequence, seq);
								scrollToBottom();
							}
						} catch (fallbackError) {
							console.warn('Fallback also failed:', fallbackError);
						}
					}
				}
			} catch (e) {
				console.warn('Polling error:', e);
			}
		}

		// ============================================
		// Message Rendering
		// ============================================
		function renderMessage(msg) {
			// Duplikasyon kontrolü - aynı mesaj ID'si zaten render edilmişse atla
			if (msg.id && document.querySelector(`[data-message-id="${msg.id}"]`)) {
				console.log('Message already rendered, skipping:', msg.id);
				return;
			}

			const div = document.createElement('div');
			const roleClass = msg.role === 'user' ? 'user-message' : 'bot-message';
			div.className = `message ${msg.role} ${roleClass}`;
			if (msg.id) {
				div.setAttribute('data-message-id', msg.id);
			}

			const bubble = document.createElement('div');
			bubble.className = 'message-bubble message-body';

			if (msg.role === 'user') {
				// Attachments varsa önce onları göster
				if (msg.attachments && msg.attachments.length > 0) {
					const attachmentsDiv = document.createElement('div');
					attachmentsDiv.className = 'message-attachments';
					attachmentsDiv.style.cssText = 'display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px;';

					for (const att of msg.attachments) {
						const attDiv = document.createElement('div');
						attDiv.className = 'attachment-preview';
						attDiv.style.cssText = 'position: relative; cursor: pointer;';

						if (att.type && att.type.startsWith('video/')) {
							// Video ikonu
							attDiv.innerHTML = `
								<div style="width: 60px; height: 60px; background: rgba(0,0,0,0.3); border-radius: 8px; display: flex; align-items: center; justify-content: center;">
									<svg width="24" height="24" viewBox="0 0 24 24" fill="white">
										<path d="M8 5v14l11-7z"/>
									</svg>
								</div>
								<span style="font-size: 10px; display: block; text-align: center; margin-top: 2px; max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${att.name || 'Video'}</span>
							`;
						} else if (att.type && att.type.startsWith('image/')) {
							// Görsel thumbnail
							const img = document.createElement('img');
							img.src = att.data || att.downloadUrl || '';
							img.alt = att.name || 'Image';
							img.style.cssText = 'width: 60px; height: 60px; object-fit: cover; border-radius: 8px;';
							img.onclick = () => showLightbox(img.src, att.name);
							attDiv.appendChild(img);
						} else {
							// Diğer dosya türleri
							attDiv.innerHTML = `
								<div style="width: 60px; height: 60px; background: rgba(0,0,0,0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center;">
									<svg width="24" height="24" viewBox="0 0 24 24" fill="white">
										<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/>
									</svg>
								</div>
								<span style="font-size: 10px; display: block; text-align: center; margin-top: 2px; max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${att.name || 'File'}</span>
							`;
						}
						attachmentsDiv.appendChild(attDiv);
					}
					bubble.appendChild(attachmentsDiv);
				}

				// Metin içeriği
				if (msg.content) {
					const textSpan = document.createElement('span');
					textSpan.textContent = msg.content;
					bubble.appendChild(textSpan);
				}
			} else {
				// Assistant message - render HTML
				bubble.innerHTML = msg.content;
			}

			div.appendChild(bubble);
			chatContainer.appendChild(div);
		}

		function scrollToBottom() {
			chatContainer.scrollTop = chatContainer.scrollHeight;
		}

		// Lightbox - görseli büyük görüntülemek için
		function showLightbox(src, alt) {
			const overlay = document.createElement('div');
			overlay.style.cssText = `
				position: fixed; top: 0; left: 0; right: 0; bottom: 0;
				background: rgba(0,0,0,0.9); z-index: 10000;
				display: flex; align-items: center; justify-content: center;
				cursor: pointer;
			`;

			const img = document.createElement('img');
			img.src = src;
			img.alt = alt || 'Image';
			img.style.cssText = 'max-width: 90%; max-height: 90%; object-fit: contain; border-radius: 8px;';

			overlay.appendChild(img);
			overlay.onclick = () => overlay.remove();
			document.body.appendChild(overlay);
		}

		// ============================================
		// Message Sending
		// ============================================
		async function sendMessage() {
			const text = messageInput.value.trim();
			if (!text && pendingAttachments.length === 0) return;

			// Disable send button
			sendBtn.disabled = true;

			try {
				// ÖNCE: Tüm attachment'ları yükle
				const uploadedAttachments = [];
				for (const att of pendingAttachments) {
					const manifest = await uploadAttachment(att);
					if (manifest) {
						// Local render için data'yı da sakla
						manifest.localData = att.data;
						uploadedAttachments.push(manifest);
					}
				}

				// SONRA: Mesajı attachment referansları ile birlikte gönder
				messageSequence++;
				const messageId = `msg-${Date.now()}-${Math.random().toString(36).substring(2, 6)}`;

				// Create message object with attachment references
				const message = {
					id: messageId,
					type: 'text',
					role: 'user', // renderMessage için gerekli
					content: text,
					attachments: uploadedAttachments.map(m => ({
						id: m.id,
						name: m.originalName,
						type: m.mimeType,
						fileName: m.fileName,
						downloadUrl: m.downloadUrl,
						data: m.localData // local render için görsel verisi
					})),
					mode: sendMode,
					timestamp: Date.now(),
					sequence: messageSequence
				};

				const messagePayload = {
					...message,
					attachments: message.attachments.map(({ data, ...rest }) => rest)
				};

				// Upload message
				const success = await uploadToGitHub(
					`sessions/${SESSION_ID}/messages/${messageId}.json`,
					messagePayload,
					`Mobile message ${messageSequence}`
				);

				if (success) {
					// Clear input
					messageInput.value = '';
					messageInput.style.height = 'auto';
					clearAttachments();

					// Render locally if in send mode - tam mesaj objesi ile render et
					if (sendMode === 'send') {
						renderMessage(message);
						scrollToBottom();
					}
				} else {
					// Mesaj gönderilemedi - kullanıcıya bildir
					showError('Mesaj gönderilemedi. Lütfen tekrar deneyin.');
				}

			} catch (error) {
				console.error('Send error:', error);
				showError('Mesaj gönderilirken hata oluştu.');
			} finally {
				sendBtn.disabled = false;
			}
		}

		async function uploadAttachment(attachment) {
			console.log('Uploading attachment:', attachment.name);

			try {
				const fileId = `file-${Date.now()}-${Math.random().toString(36).substring(2, 6)}`;
				const extension = attachment.name.split('.').pop() || 'bin';
				const fileName = `${fileId}.${extension}`;
				const filePath = `sessions/${SESSION_ID}/files/${fileName}`;

				// Base64 data'dan sadece veri kısmını al (data:image/png;base64,XXX formatından)
				const base64Data = attachment.data.split(',')[1];

				if (!base64Data) {
					console.error('Invalid attachment data format');
					return null;
				}

				// GitHub'a dosyayı yükle
				const uploadResponse = await fetchFromGitHub(filePath, {
					method: 'PUT',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({
						message: `Upload file: ${attachment.name}`,
						content: base64Data,
						branch: GITHUB_BRANCH
					})
				});

				if (!uploadResponse.ok) {
					const errorText = await uploadResponse.text();
					console.error('File upload failed:', uploadResponse.status, errorText);
					return null;
				}

				const uploadResult = await uploadResponse.json();
				console.log('File uploaded successfully:', fileName);

				// Dosya manifest objesi oluştur - text mesajının attachments dizisine eklenecek
				// NOT: Artık ayrı manifest dosyası yüklemiyoruz, text mesajındaki attachments YETERLİ!
				const manifest = {
					id: fileId,
					type: 'file',
					originalName: attachment.name,
					fileName: fileName,
					mimeType: attachment.type,
					size: attachment.file ? attachment.file.size : 0,
					mode: sendMode,
					timestamp: Date.now(),
					downloadUrl: uploadResult.content?.download_url || null,
					sequence: messageSequence
				};

				// Manifest artık ayrı dosya olarak yüklenmiyor - text attachments ile gidecek
				console.log('File uploaded successfully, manifest:', manifest);
				return manifest;
			} catch (error) {
				console.error('uploadAttachment error:', error);
				return null;
			}
		}

		// ============================================
		// Attachment Handling
		// ============================================
		function handleFileSelect(files) {
			for (const file of files) {
				if (pendingAttachments.length >= 5) break;

				const reader = new FileReader();
				reader.onload = (e) => {
					const att = {
						id: `att-${Date.now()}`,
						name: file.name,
						type: file.type,
						data: e.target.result,
						file: file
					};
					pendingAttachments.push(att);
					renderAttachmentPreview(att);
					updateSendButton();
				};
				reader.readAsDataURL(file);
			}
		}

		function renderAttachmentPreview(att) {
			const div = document.createElement('div');
			div.className = 'attachment-preview';
			div.id = att.id;

			if (att.type.startsWith('video/')) {
				const video = document.createElement('video');
				video.src = att.data;
				div.appendChild(video);
			} else {
				const img = document.createElement('img');
				img.src = att.data;
				div.appendChild(img);
			}

			const removeBtn = document.createElement('button');
			removeBtn.className = 'attachment-remove';
			removeBtn.innerHTML = '×';
			removeBtn.onclick = () => removeAttachment(att.id);
			div.appendChild(removeBtn);

			attachmentPreviewBar.appendChild(div);
		}

		function removeAttachment(id) {
			pendingAttachments = pendingAttachments.filter(a => a.id !== id);
			const el = document.getElementById(id);
			if (el) el.remove();
			updateSendButton();
		}

		function clearAttachments() {
			pendingAttachments = [];
			attachmentPreviewBar.innerHTML = '';
			updateSendButton();
		}

		// ============================================
		// UI Updates
		// ============================================
		function setConnected(connected) {
			isConnected = connected;
			statusDot.classList.toggle('disconnected', !connected);
			statusText.textContent = connected ? 'Bağlı' : 'Bağlantı kesildi';
		}

		function showError(message) {
			connectionStatus.innerHTML = `
				<h2>Bağlantı Hatası</h2>
				<p>${message}</p>
			`;
			setConnected(false);
		}

		function updateSendButton() {
			const hasText = messageInput.value.trim().length > 0;
			const hasAttachments = pendingAttachments.length > 0;
			sendBtn.disabled = !isConnected || (!hasText && !hasAttachments);
		}

		function autoResizeInput() {
			messageInput.style.height = 'auto';
			messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
		}

		// ============================================
		// Event Listeners
		// ============================================
		messageInput.addEventListener('input', () => {
			autoResizeInput();
			updateSendButton();
		});

		sendBtn.addEventListener('click', sendMessage);

		// Mode toggle
		document.querySelectorAll('.mode-option').forEach(btn => {
			btn.addEventListener('click', () => {
				document.querySelectorAll('.mode-option').forEach(b => b.classList.remove('active'));
				btn.classList.add('active');
				sendMode = btn.dataset.mode;
			});
		});

		// File inputs
		document.getElementById('camera-btn').addEventListener('click', () => cameraInput.click());
		document.getElementById('gallery-btn').addEventListener('click', () => galleryInput.click());
		document.getElementById('video-btn').addEventListener('click', () => videoInput.click());

		cameraInput.addEventListener('change', (e) => handleFileSelect(e.target.files));
		galleryInput.addEventListener('change', (e) => handleFileSelect(e.target.files));
		videoInput.addEventListener('change', (e) => handleFileSelect(e.target.files));

		// ============================================
		// Initialize
		// ============================================
		initSession();
	</script>
</body>

</html>
